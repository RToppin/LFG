name: CI

on:
  pull_request:
  push:
    branches: [main, master, feature/lfg-core-platform]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lfg
          POSTGRES_PASSWORD: lfg
          POSTGRES_DB: lfg
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://lfg:lfg@localhost:5432/lfg?schema=public
      AUTH_SECRET: ci-development-secret-at-least-sixteen
      AUTH_URL: http://localhost:3000
      ENABLE_TEST_AUTH: "true"
      CRON_SECRET: ci-cron-secret-at-least-sixteen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
